kind: ExperimentPlan
metadata:
  name: home_edge_to_bw_stress_0c
  description: >
    Stress test with 0/8 stressed CPU cores.
  scenarioRef: home-3cer
spec:
  execution:
    stopOnFailure: true
    connectivityPrecheck: true

  selections:
    runtimeEnv: zenoh-unit8-vm

  execEdge:
    - edgeRefs: [edge_to_cloud]
      exploration:
        cloud_cpu_cores: [4]
        cloud_mem_gb: [1]
        icopa_sender:payload_size: ['64KB', '96KB']
        icopa_sender:frequency_hz: [60]
        icopa_sender:json_duration_sec: [60]
        icopa_responder:response_payload_size: ['16KB']
      phases:
        # - name: setup_routing
        #   useTemplate: setup_routing
        - name: profiling
          useTemplate: profiling
        - name: collect_metrics
          useTemplate: collect_metrics
        - name: cleanup_profiling
          useTemplate: cleanup_profiling
        # - name: cleanup_router
        #   useTemplate: cleanup_router

