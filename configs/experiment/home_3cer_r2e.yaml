kind: ExperimentPlan
metadata:
  name: exp_home_3cer_r2e_wifi6
  description: >
    Edge-scoped experiment generated from the 3-node lab scenario.
    Each selected edge becomes one generated run per variant.
  scenarioRef: home-3cer
spec:
  execution:
    stopOnFailure: true
    connectivityPrecheck: true

  selections:
    runtimeEnv: zenoh-unit8-vm

  execEdge:
    - edgeRefs: [robot_to_edge]
      exploration:
        cloud_cpu_cores: [2]
        cloud_mem_gb: [1]
        icopa_sender:payload_size: ['1KB', '16KB', '64KB', '128KB', '512KB', '1MB']
        icopa_sender:frequency_hz: [30]
        icopa_sender:json_duration_sec: [60]
        icopa_responder:response_payload_size: ['16KB']
      phases:
        # - name: setup_routing
        #   useTemplate: setup_routing
        - name: profiling
          useTemplate: profiling
        - name: collect_metrics
          useTemplate: collect_metrics
        - name: cleanup_profiling
          useTemplate: cleanup_profiling
        # - name: cleanup_router
        #   useTemplate: cleanup_router

