kind: ExperimentPlan
metadata:
  name: iros_lab_edge_gc_stress_1_of_8_cores
  description: >
    Lab edge server to the gz center, stressing 7 cores
  scenarioRef: ltc-zenoh-serializer-multi-cloud
spec:
  execution:
    stopOnFailure: true
    connectivityPrecheck: true

  selections:
    runtimeEnv: sc-zenoh-serializer-unit8  # sc-zenoh-serializer-unit8 | 

  execEdge:
    - edgeRefs: [edge_to_az_gc] # edge_to_az_gc | edge_to_az_north_eu | edge_to_az_uk_south | edge_to_az_west_eu
      exploration:
        cloud_cpu_cores: [4]
        cloud_mem_gb: [1]
        icopa_sender:payload_size: ['64KB', '128KB', '256KB', '512KB', '1024KB', '2048KB']
        icopa_sender:frequency_hz: [30]
        icopa_sender:json_duration_sec: [30]
        icopa_responder:response_payload_size: ['16KB']
      phases:
        # - name: setup_routing
        #   useTemplate: setup_routing
        - name: profiling
          useTemplate: profiling
        - name: collect_metrics
          useTemplate: collect_metrics
        - name: cleanup_profiling
          useTemplate: cleanup_profiling
        # - name: cleanup_router
        #   useTemplate: cleanup_router

