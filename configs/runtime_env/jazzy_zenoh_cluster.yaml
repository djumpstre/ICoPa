kind: RuntimeEnvironment
metadata:
  name: ros2-jazzy-zenoh
  tags:
    ros2:
      distro: jazzy
      rmw: rmw_cyclonedds_cpp
    zenoh:
      enabled: true
      routerPort: 7447
      configMountPath: "/etc/zenoh/router.json5"
spec:
  images:
    # can be used by either docker-on-vm or k8s
    runnerImage: "" # Required: set your container image reference before use.

  parameters:
    cloud_router_ep: "tcp/<CLOUD_VM_PUBLIC_IP>:7447"
    local_router_listen_ep: '["tcp/
    pub_topic: "/chatter"
    sub_topic: "/chatter_response"
    pub_rate_hz: 100.0
    pub_msg: "hello"
    response_msg: "hello_response"

  command-presets:
    # preset is a named sequence of commands
    # executor: "ssh" for VM nodes, "k8s" for k8s nodes
    - name: cloud_router
      - name: start-zenoh-router
        run:
          executor: ssh
          command: |
            docker rm -f zenoh-router || true
            docker run -d --name zenoh-router --network host \
             xxxx TODO:

    - name: local_router
      - name: start-zenoh-router
        run:
          executor: ssh
          command: |
            docker rm -f zenoh-router || true
            docker run -d --name zenoh-router --network host \
             xxxx TODO:

    - name: sender
      run:
        executor: auto
        command: |
          echo "start"
          sleep 3
          docker run x...
    
    - name: responder
      run:
        executor: auto
        command: |
          echo "start"
          docker run xxxx

  artifacts:
    # where the runner should write results/logs on the target
    remoteWorkDir: "/tmp/netanalyzer"
    collectGlobs:
      - "/tmp/netanalyzer/**/*.json"
      - "/tmp/netanalyzer/**/*.csv"
      - "/tmp/netanalyzer/**/*.log"


